name: Deploy Harness Studio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site (harness.html as index.html)
        run: |
          mkdir -p _site
          cp harness.html _site/index.html
          cp harness.html _site/harness.html
          cp -r docs _site/docs
          cp -r vendor _site/vendor
          # 内蔵LLMの本体が配信物に入っていなければ、ここで落とす
          # （入れ忘れると端末側は「Importing a module script failed」になるだけで原因が分からない）
          test -s _site/vendor/web-llm/index.js
          echo "_site の中身:"; find _site -maxdepth 2 -type f | sort
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
