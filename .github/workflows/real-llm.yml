# 本物のモデルで推論できるかを、実際に動かして確かめる。
# Claude Code の実行環境からは HuggingFace に届かないので、ここ（GitHub Actions）で走らせる。
# GPUは無く swiftshader（CPUでのWebGPU）なので遅いが、
# 「GrammarMatcherInitError で落ちる」ような事故はここで捕まえられる。
name: Real local LLM check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'harness.html'
      - 'vendor/**'
      - 'tests/harness-real-llm.mjs'
      - '.github/workflows/real-llm.yml'

permissions:
  contents: read

jobs:
  real:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_MODEL: SmolLM2-360M-Instruct-q4f32_1-MLC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright と Chromium を入れる
        run: |
          set -e
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      # ソフトウェア実装のWebGPU（SwiftShader）は shader-f16 を持たないので、
      # CIでは f16 のいらない q4f32 版で確かめる（コードの経路は同じ）。
      - name: モデルの置き場をキャッシュから戻す
        id: mcache
        uses: actions/cache@v4
        with:
          path: .modele2e
          key: mlc-e2e-${{ env.E2E_MODEL }}

      - name: モデルを取ってくる
        if: steps.mcache.outputs.cache-hit != 'true'
        run: |
          set -e
          python -m pip install --quiet --upgrade huggingface_hub
          python tools/models.py fetch1 "mlc-ai/$E2E_MODEL" ".modele2e/$E2E_MODEL"

      - name: 取れているか確かめる
        run: |
          set -e
          d=".modele2e/$E2E_MODEL"
          rm -rf "$d/.cache"
          ls -la "$d" | head -20
          test -s "$d/mlc-chat-config.json"
          test -s "$d/ndarray-cache.json"
          test -s "$d/tokenizer.json"
          test -n "$(ls "$d"/params_shard_*.bin 2>/dev/null)"
          test -z "$(find "$d" -type f -size 0)"
          du -sh "$d"

      - name: 本物のモデルで推論する（素の生成 / JSON強制）
        run: |
          set -e
          export MODEL_DIR="$PWD/.modele2e/$E2E_MODEL"
          export MODEL_ID="$E2E_MODEL"
          node tests/harness-real-llm.mjs

      - name: 重みを Git に入れていないことを確かめる
        run: |
          set -e
          if git ls-files | grep -E '\.(bin|safetensors|wasm)$' | grep -v '^vendor/' | grep -q .; then
            echo "::error::重みが Git に入っている"; git ls-files | grep -E '\.(bin|safetensors)$'; exit 1
          fi
          echo "OK: 重みは Git に入っていない"

  # WebGPU を使わない道（Wllama / GGUF / CPU）。GPUが要らないので、ここで本当に動かせる。
  wllama:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GGUF_REPO: Qwen/Qwen2.5-0.5B-Instruct-GGUF
      GGUF_FILE: qwen2.5-0.5b-instruct-q4_k_m.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright と Chromium を入れる
        run: |
          set -e
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: GGUF をキャッシュから戻す
        id: gcache
        uses: actions/cache@v4
        with:
          path: .gguf
          key: gguf-${{ env.GGUF_REPO }}-${{ env.GGUF_FILE }}
      - name: GGUF を取ってくる
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          set -e
          python -m pip install --quiet --upgrade huggingface_hub
          python tools/models.py gguf "$GGUF_REPO" "$GGUF_FILE" .gguf
      - name: 本物のGGUFをCPUで動かす
        run: |
          set -e
          ls -la .gguf
          export GGUF_PATH="$PWD/.gguf/$GGUF_FILE"
          test -s "$GGUF_PATH"
          du -h "$GGUF_PATH"
          node tests/harness-real-wllama.mjs
