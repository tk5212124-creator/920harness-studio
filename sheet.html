<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>方眼シート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen workbook — file bar, format bar, formula bar, scrolling grid with sticky headers, sheet tabs + LLM chip + status line */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#1a2030; --muted:#5d687c; --line:#d3d9e3; --grid:#e1e5ec;
  --head:#e9edf3; --head-ink:#4b556a; --accent:#2752c4; --accent-ink:#ffffff; --accent-soft:rgba(39,82,196,.11);
  --hsel:#d3ddf6; --err:#b5302a; --spill:rgba(39,82,196,.035); --live:#1f7a52;
  --ui:"IBM Plex Sans JP",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rowh:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#181c24; --ink:#e4e8ef; --muted:#97a1b3; --line:#2b313c; --grid:#252a34;
  --head:#1f242d; --head-ink:#a3acbd; --accent:#7096ff; --accent-ink:#0d1224; --accent-soft:rgba(112,150,255,.17);
  --hsel:#27345c; --err:#ff7d70; --spill:rgba(112,150,255,.06); --live:#5fd39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#181c24; --ink:#e4e8ef; --muted:#97a1b3; --line:#2b313c; --grid:#252a34;
  --head:#1f242d; --head-ink:#a3acbd; --accent:#7096ff; --accent-ink:#0d1224; --accent-soft:rgba(112,150,255,.17);
  --hsel:#27345c; --err:#ff7d70; --spill:rgba(112,150,255,.06); --live:#5fd39a; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;overflow:hidden}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;gap:6px;padding-inline:16px;padding-block:10px 6px}
.bar{display:flex;align-items:center;gap:2px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;flex:none}
.bar::-webkit-scrollbar{display:none}
.top{background:transparent;border:none;padding:0 0 2px;gap:6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:.02em;margin-right:auto;padding-right:8px}
.mark{width:18px;height:18px;border:1.5px solid var(--accent);border-radius:3px;background:
  linear-gradient(var(--accent),var(--accent)) 5px 0/1.5px 100% no-repeat,
  linear-gradient(var(--accent),var(--accent)) 0 5px/100% 1.5px no-repeat,
  linear-gradient(var(--accent-soft),var(--accent-soft))}
.btn{height:30px;min-width:30px;padding:0 8px;border:1px solid transparent;background:transparent;border-radius:6px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:none}
.btn:hover{background:var(--head)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.on{background:var(--hsel);color:var(--accent)}
.btn.solid{background:var(--surface);border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.sel{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:0 6px;flex:none}
.swatch{position:relative;overflow:hidden}
.swatch input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.swatch i{display:block;width:14px;height:3px;border-radius:1px;margin-top:1px}
.swatch span{display:flex;flex-direction:column;align-items:center;line-height:1}
.fxbar{display:flex;gap:6px;align-items:stretch;flex:none}
#nb,#fx{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:13px;padding:0 8px;min-width:0}
#nb{width:78px;text-align:center;flex:none}
#fx::placeholder{color:var(--muted);opacity:.8}
.fxl{display:flex;align-items:center;font-family:Georgia,"Times New Roman",serif;font-style:italic;color:var(--muted);padding:0 2px;flex:none}
#fx{flex:1}
.gridwrap{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;position:relative;overscroll-behavior:contain}
.inner{position:relative;display:inline-block;vertical-align:top}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--surface)}
th,td{height:var(--rowh);padding:0 5px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);white-space:nowrap;overflow:hidden;line-height:calc(var(--rowh) - 1px);user-select:none;-webkit-user-select:none}
td{position:relative;font-variant-numeric:tabular-nums;cursor:cell}
td.sp{overflow:visible}
td.n{text-align:right}
td.e{color:var(--err);text-align:center;font-weight:500}
td.pd{color:var(--muted);text-align:center;font-style:italic}
td.bo{text-align:center}
td.sl{background:var(--spill)}
td.ins{box-shadow:inset 0 0 0 999px var(--accent-soft)}
thead th{position:sticky;top:0;z-index:3;background:var(--head);color:var(--head-ink);font-weight:500;font-size:12px;text-align:center;border-color:var(--line);cursor:s-resize}
tbody th{position:sticky;left:0;z-index:2;background:var(--head);color:var(--head-ink);font-weight:400;font-size:12px;text-align:center;border-color:var(--line);font-family:var(--mono);cursor:e-resize}
thead th.corner{left:0;z-index:4;cursor:default}
th.hs{background:var(--hsel);color:var(--accent);font-weight:600}
.rz{position:absolute;right:-4px;top:0;width:8px;height:100%;cursor:col-resize;z-index:5;touch-action:none}
.box{position:absolute;pointer-events:none;z-index:1}
#selbox{border:2px solid var(--accent)}
#pickbox{border:2px dashed var(--accent)}
#fillbox{border:1.5px dashed var(--muted)}
#cutbox{border:2px dashed var(--muted)}
#spillbox{border:1px solid var(--accent);opacity:.7}
#fillh{position:absolute;right:-5px;bottom:-5px;width:9px;height:9px;background:var(--accent);border:1.5px solid var(--surface);pointer-events:auto;cursor:crosshair;touch-action:none}
#fillh::after{content:"";position:absolute;inset:-9px}
#ed{position:absolute;z-index:2;opacity:0;pointer-events:none;border:none;margin:0;padding:0 4px;font:13px var(--ui);color:var(--ink);background:var(--surface);outline:2px solid var(--accent);outline-offset:-1px;height:var(--rowh);min-width:20px}
#ed.on{opacity:1;pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.foot{display:flex;align-items:center;gap:8px;flex:none;min-height:30px}
/* Harness Studio の「方眼」タブの中（?embed=harness）: 本の操作・書式・シートの切り替えは出さない */
body.embed .brand,body.embed #bNew,body.embed #bOpen,body.embed #bExport,body.embed #toolbar,body.embed .tabs{display:none!important}
body.embed .foot{justify-content:flex-end}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;align-items:center}
.tabs::-webkit-scrollbar{display:none}
.tab{height:28px;padding:0 12px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--head)}
.tab.on{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--accent)}
.tab input{width:110px;height:22px;border:1px solid var(--accent);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;padding:0 4px}
.tab .del{color:var(--err);font-size:12px;border:none;background:none;cursor:pointer;font:inherit;padding:0 2px}
.chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12px;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:6px;max-width:46%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.chip.run{color:var(--ink)}.chip.run .dot{background:var(--live);animation:pulse 1.2s ease-in-out infinite}
.chip.wait{color:var(--accent);border-color:var(--accent)}.chip.wait .dot{background:var(--accent)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.chip.run .dot{animation:none}}
.stat{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.modal{position:fixed;inset:0;background:rgba(10,14,24,.42);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.panel{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(620px,100%);max-height:88%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.panel h2{margin:0;font-size:16px;font-weight:600;text-wrap:balance}
.panel h3{margin:4px 0 0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.panel p{margin:0;color:var(--muted);line-height:1.65;max-width:64ch}
.panel textarea{width:100%;height:180px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:8px;resize:vertical}
.panel input[type=text]{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px;padding:0 8px;min-width:0}
.panel .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.panel .row.l{justify-content:flex-start}
.panel code{font-family:var(--mono);font-size:12px;background:var(--head);border-radius:4px;padding:1px 5px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.keys kbd,.keys code{font-family:var(--mono);font-size:12px;background:var(--head);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap;justify-self:start}
.ex{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.ex code{display:block;white-space:pre-wrap;word-break:break-all;padding:6px 8px}
.fnlist{font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--muted)}
.qlist{font-size:12px;color:var(--muted);font-family:var(--mono);line-height:1.6;max-height:120px;overflow:auto;background:var(--bg);border-radius:6px;padding:6px 8px}
.names{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.names code{word-break:break-all}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-radius:0;height:28px}
.warn{color:var(--err)}
.demo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:8px 10px}
.demo .dtx{flex:1 1 240px;min-width:0;font-size:12.5px;line-height:1.55;color:var(--ink)}
.demo .dtx b{font-weight:600}
.demo .dtx .sub{display:block;color:var(--muted);font-size:12px}
.demo .btn.primary{height:34px;padding:0 14px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px);text-align:center;transition:opacity .2s}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:560px){.brand .tx{display:none}.stat{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="bar top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span class="tx">方眼シート</span></div>
    <button class="btn" id="bUndo" title="元に戻す (Ctrl+Z)">↶</button>
    <button class="btn" id="bRedo" title="やり直す (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <button class="btn solid" id="bNew">新規</button>
    <button class="btn solid" id="bOpen">読み込み</button>
    <button class="btn solid" id="bExport">書き出し</button>
    <button class="btn" id="bHelp" title="操作と関数">？</button>
    <input type="file" id="file" accept=".csv,.tsv,.txt,.xlsx,.xls,.xlsm" hidden>
  </div>

  <div class="bar" id="toolbar">
    <button class="btn" id="tB" title="太字 (Ctrl+B)"><b>B</b></button>
    <button class="btn" id="tI" title="斜体 (Ctrl+I)"><i>I</i></button>
    <button class="btn" id="tU" title="下線 (Ctrl+U)"><u>U</u></button>
    <span class="sep"></span>
    <button class="btn" id="tAL" title="左揃え">⇤</button>
    <button class="btn" id="tAC" title="中央揃え">↔</button>
    <button class="btn" id="tAR" title="右揃え">⇥</button>
    <span class="sep"></span>
    <label class="btn swatch" title="文字色"><span>A<i id="fgSw" style="background:#c0362c"></i></span><input type="color" id="tFg" value="#c0362c"></label>
    <label class="btn swatch" title="塗りつぶし"><span>▦<i id="bgSw" style="background:#fff2a8"></i></span><input type="color" id="tBg" value="#fff2a8"></label>
    <button class="btn" id="tBd" title="罫線（格子）">⊞</button>
    <button class="btn" id="tClrF" title="書式をクリア">書式消去</button>
    <span class="sep"></span>
    <select class="sel" id="tFmt" title="表示形式">
      <option value="g">標準</option><option value="int">整数</option><option value="comma">桁区切り</option>
      <option value="yen">通貨 ¥</option><option value="pct">パーセント</option><option value="fix2">小数2桁</option><option value="text">文字列</option>
    </select>
    <select class="sel" id="tFn" title="関数を挿入"><option value="">関数</option></select>
    <button class="btn" id="tNames" title="名前の定義（LAMBDA に名前を付ける）">名前</button>
    <button class="btn" id="tLLM" title="LLMの設定と実行">LLM</button>
    <span class="sep"></span>
    <button class="btn" id="tRowIns" title="行を上に挿入">行＋</button>
    <button class="btn" id="tRowDel" title="選択行を削除">行－</button>
    <button class="btn" id="tColIns" title="列を左に挿入">列＋</button>
    <button class="btn" id="tColDel" title="選択列を削除">列－</button>
    <span class="sep"></span>
    <button class="btn" id="tSortA" title="昇順に並べ替え">昇順</button>
    <button class="btn" id="tSortD" title="降順に並べ替え">降順</button>
    <span class="sep"></span>
    <button class="btn" id="tCopy" title="コピー (Ctrl+C)">コピー</button>
    <button class="btn" id="tCut" title="切り取り (Ctrl+X)">切取</button>
    <button class="btn" id="tPaste" title="このシート内でコピーした範囲を貼り付け">貼付</button>
    <button class="btn" id="tRange" title="タップで範囲を広げる">範囲</button>
  </div>

  <div class="fxbar">
    <input id="nb" aria-label="セル番地" spellcheck="false" autocomplete="off">
    <span class="fxl">fx</span>
    <input id="fx" aria-label="数式バー" spellcheck="false" autocomplete="off">
  </div>

  <div class="demo" id="demoBar" hidden>
    <div class="dtx" id="demoTx"></div>
    <button class="btn primary" id="demoRun">▶ デモを実行</button>
  </div>

  <div class="gridwrap" id="wrap">
    <div class="inner" id="inner">
      <table id="tbl"></table>
      <div class="box" id="spillbox" hidden></div>
      <div class="box" id="selbox"><div id="fillh"></div></div>
      <div class="box" id="pickbox" hidden></div>
      <div class="box" id="fillbox" hidden></div>
      <div class="box" id="cutbox" hidden></div>
      <input id="ed" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="セル入力">
    </div>
  </div>

  <div class="foot">
    <div class="tabs" id="tabs"></div>
    <button class="chip" id="llmChip" title="LLMの実行状況"><span class="dot"></span><span id="llmChipT">LLM</span></button>
    <div class="stat" id="stat"></div>
  </div>
</div>
<div id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="panel" id="panel"></div></div>

<script>
(()=>{
'use strict';
/*#ENGINE — 数式エンジン（DOMに触らない。tests/sheet.mjs がこの区間だけを取り出して直接叩く）*/
const JP='\\u3040-\\u30ff\\u3400-\\u9fff\\uff00-\\uffef';
const NAME_SRC=`(?:'(?:[^']|'')+'|[A-Za-z_${JP}][\\w${JP}]*)`;
const REF_RE=new RegExp(`(?<![\\w.$${JP}])(${NAME_SRC}!)?(\\$?)([A-Za-z]{1,3})(\\$?)(\\d+)(?![\\w(!${JP}])`,'g');
const SHEET_TOK=new RegExp(`^${NAME_SRC}!`);
const IDENT_RE=new RegExp(`^[A-Za-z_${JP}][\\w.${JP}]*`);
const ERR=(e,msg)=>msg?{err:e,msg}:{err:e}, isErr=v=>v!==null&&typeof v==='object'&&'err' in v;
const PENDING_ERRS=['#待機中','#実行中','#未実行'];
const colName=c=>{let s='';c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26)}return s};
const colIdx=s=>{let n=0;for(const ch of s)n=n*26+(ch.charCodeAt(0)-64);return n-1};
const A1=(r,c)=>colName(c)+(r+1);
const parseA1=k=>{const m=/^\$?([A-Za-z]{1,3})\$?(\d+)$/.exec(k);return m?{r:+m[2]-1,c:colIdx(m[1].toUpperCase())}:null};
const unq=s=>s[0]==="'"?s.slice(1,-1).replace(/''/g,"'"):s;
const sheetRefName=n=>new RegExp(`^[A-Za-z_${JP}][\\w${JP}]*$`).test(n)&&!/^[A-Za-z]{1,3}\d+$/.test(n)?n:"'"+n.replace(/'/g,"''")+"'";
const pad=n=>String(n).padStart(2,'0');
const DEFAULT_SYSTEM='あなたは表計算ソフトの関数として呼ばれている。指示に従い、答えだけを返す。前置き・説明・引用符は書かない。';
const DEFAULT_LLM=()=>({
  def:'local',auto:false,system:DEFAULT_SYSTEM,
  providers:{
    local:{adapter:'openai_local',endpoint:'http://localhost:11434/v1',model:'qwen2.5:3b',generation:{maxTokens:256,temperature:0}},
    device:{adapter:'webllm',model:'Qwen2.5-0.5B-Instruct-q4f16_1-MLC',useWorker:true,generation:{maxTokens:256,temperature:0}},
    test:{adapter:'mock'}
  }});

let wb=null;
const newSheet=name=>({name,cells:{},nr:100,nc:26,cw:{}});
function fixBook(o){o.names=o.names||{};o.llm=Object.assign(DEFAULT_LLM(),o.llm||{});return o}

/* ---------- values ---------- */
function parseNumStr(s){
  s=String(s).trim();if(!s)return null;let pct=false;
  if(s.endsWith('%')){pct=true;s=s.slice(0,-1)}
  s=s.replace(/^([-+]?)[¥$]/,'$1').replace(/,(?=\d{3}(\D|$))/g,'');
  if(!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s))return null;
  const n=parseFloat(s);return pct?n/100:n;
}
const isArr=v=>!!(v&&v.rng);
const single=v=>v.rng.length===1&&v.rng[0].length===1;
const scalar=v=>v&&v.rng?(v.rng[0]&&v.rng[0][0]!==undefined?v.rng[0][0]:null):v;
const toArr=v=>v&&v.rng?v.rng:[[v]];
function toNum(v){v=scalar(v);if(isErr(v))throw v;if(v===null||v==='')return 0;if(typeof v==='number')return v;if(typeof v==='boolean')return v?1:0;if(v&&v.fnv)throw ERR('#VALUE!','LAMBDA は数値にできない');if(isJ(v))throw ERR('#VALUE!','JSON は数値にできない（JSONGET で中の数を取り出す）');const n=parseNumStr(v);if(n===null)throw ERR('#VALUE!','数値にできない: '+String(v).slice(0,20));return n}

  COUNT:a=>{let k=0;for(const t of a){let v;try{v=t()}catch(e){continue}if(v&&v.rng){for(const x of flat(v))if(typeof x==='number')k++}else if(typeof v==='number'||(typeof v==='string'&&parseNumStr(v)!==null))k++}return k},
  COUNTA:a=>{let k=0;for(const t of a){let v;try{v=t()}catch(e){k++;continue}for(const x of flat(v))if(x!==null&&x!=='')k++}return k},
  COUNTBLANK:a=>{need(a,1);return flat(a[0]()).filter(x=>x===null||x==='').length},
  IF:a=>{need(a,1,3);const c=a[0]();
    if(isArr(c)&&!single(c)){const T=a[1]?a[1]():true,F=a[2]?a[2]():false;return bcast([c,T,F],(x,t,f)=>toBool(x)?t:f)}
    return toBool(scalar(c))?(a[1]?a[1]():true):(a[2]?a[2]():false)},
  IFS:a=>{if(!a.length||a.length%2)throw ERR('#VALUE!');for(let i=0;i<a.length;i+=2)if(toBool(V(a[i])))return a[i+1]();throw ERR('#N/A','どの条件にも当たらない')},
  SWITCH:a=>{if(a.length<3)throw ERR('#VALUE!');const x=V(a[0]);let i=1;for(;i+1<a.length;i+=2)if(cmpVals(x,V(a[i]))===0)return a[i+1]();if(i<a.length)return a[i]();throw ERR('#N/A','どれにも当たらない')},
  CHOOSE:a=>{if(a.length<2)throw ERR('#VALUE!');const i=Math.floor(toNum(V(a[0])));if(i<1||i>=a.length)throw ERR('#VALUE!');return a[i]()},
  IFERROR:a=>{need(a,2);try{const v=a[0]();if(isErr(scalar(v)))return a[1]();return v}catch(e){if(isErr(e))return a[1]();throw e}},
  AND:a=>{let r=true;for(const t of a)for(const x of flat(t()))if(x!==null&&typeof x!=='string'&&!toBool(x))r=false;return r},
  OR:a=>{let r=false;for(const t of a)for(const x of flat(t()))if(x!==null&&typeof x!=='string'&&toBool(x))r=true;return r},
  NOT:a=>{need(a,1);return bcast([a[0]()],x=>!toBool(x))},
  ROUND:a=>{need(a,1,2);const d=a[1]?toNum(V(a[1])):0;return bcast([a[0]()],x=>roundX(toNum(x),d))},
  ROUNDUP:a=>{need(a,1,2);const d=a[1]?toNum(V(a[1])):0;return bcast([a[0]()],x=>roundX(toNum(x),d,'up'))},
  ROUNDDOWN:a=>{need(a,1,2);const d=a[1]?toNum(V(a[1])):0;return bcast([a[0]()],x=>roundX(toNum(x),d,'down'))},
  INT:a=>{need(a,1);return bcast([a[0]()],x=>Math.floor(toNum(x)))},
  ABS:a=>{need(a,1);return bcast([a[0]()],x=>Math.abs(toNum(x)))},
  MOD:a=>{need(a,2);return bcast([a[0](),a[1]()],(x,y)=>{const n=toNum(x),d=toNum(y);if(d===0)throw ERR('#DIV/0!');return n-d*Math.floor(n/d)})},
  SQRT:a=>{need(a,1);return bcast([a[0]()],x=>{const n=toNum(x);if(n<0)throw ERR('#NUM!','負の数の平方根');return Math.sqrt(n)})},
  POWER:a=>{need(a,2);return bcast([a[0](),a[1]()],(x,y)=>Math.pow(toNum(x),toNum(y)))},
  ISODD:a=>{need(a,1);return bcast([a[0]()],x=>Math.abs(Math.trunc(toNum(x)))%2===1)},
  ISEVEN:a=>{need(a,1);return bcast([a[0]()],x=>Math.abs(Math.trunc(toNum(x)))%2===0)},
  PI:()=>Math.PI,
  RAND:()=>Math.random(),
  VALUE:a=>{need(a,1);return bcast([a[0]()],x=>toNum(x))},
  CONCAT:a=>a.map(t=>flat(t()).map(toStr).join('')).join(''),
  CONCATENATE:a=>a.map(t=>toStr(V(t))).join(''),
  TEXTJOIN:a=>{const d=toStr(V(a[0])),ig=toBool(V(a[1]));const o=[];for(const t of a.slice(2))for(const x of flat(t())){const s=toStr(x);if(!(ig&&s===''))o.push(s)}return o.join(d)},
  TEXTSPLIT:a=>{need(a,2,3);const s=toStr(V(a[0])),cd=toStr(V(a[1])),rd=a[2]?toStr(V(a[2])):'';
    const rows=(rd?s.split(rd):[s]).map(r=>cd?r.split(cd):[r]);const w=Math.max(...rows.map(r=>r.length));
    return{rng:rows.map(r=>{const o=r.slice();while(o.length<w)o.push(ERR('#N/A'));return o})}},
  LEN:a=>{need(a,1);return bcast([a[0]()],x=>[...toStr(x)].length)},
  LEFT:a=>{need(a,1,2);const n=a[1]?toNum(V(a[1])):1;return bcast([a[0]()],x=>[...toStr(x)].slice(0,n).join(''))},
  RIGHT:a=>{need(a,1,2);const n=a[1]?toNum(V(a[1])):1;return bcast([a[0]()],x=>n<=0?'':[...toStr(x)].slice(-n).join(''))},
  MID:a=>{need(a,3);const st=toNum(V(a[1]))-1,n=toNum(V(a[2]));return bcast([a[0]()],x=>[...toStr(x)].slice(st,st+n).join(''))},
  UPPER:a=>bcast([a[0]()],x=>toStr(x).toUpperCase()),
  LOWER:a=>bcast([a[0]()],x=>toStr(x).toLowerCase()),
  TRIM:a=>bcast([a[0]()],x=>toStr(x).replace(/[ 　]+/g,' ').trim()),
  SUBSTITUTE:a=>{need(a,3);const f=toStr(V(a[1])),t=toStr(V(a[2]));return bcast([a[0]()],x=>toStr(x).split(f).join(t))},
  ISBLANK:a=>{need(a,1);let v;try{v=V(a[0])}catch(e){return false}return v===null},
  ISNUMBER:a=>{try{return typeof V(a[0])==='number'}catch(e){return false}},
  ISTEXT:a=>{try{return typeof V(a[0])==='string'}catch(e){return false}},
  ISERROR:a=>{try{return isErr(V(a[0]))}catch(e){if(isErr(e))return true;throw e}},
  TODAY:()=>{const d=new Date();return`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`},
  NOW:()=>{const d=new Date();return`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`},
  VLOOKUP:a=>{need(a,3,4);const k=V(a[0]),R=rngOf(a[1]).rng,ci=toNum(V(a[2]))-1;if(ci<0||ci>=R[0].length)throw ERR('#REF!');
    const ap=a[3]?toBool(V(a[3])):true;const i=lookupIdx(R.map(r=>r[0]),k,ap?1:0);if(i<0)throw ERR('#N/A','見つからない');return R[i][ci]},
  HLOOKUP:a=>{need(a,3,4);const k=V(a[0]),R=rngOf(a[1]).rng,ri=toNum(V(a[2]))-1;if(ri<0||ri>=R.length)throw ERR('#REF!');
    const ap=a[3]?toBool(V(a[3])):true;const i=lookupIdx(R[0],k,ap?1:0);if(i<0)throw ERR('#N/A','見つからない');return R[ri][i]},
  XLOOKUP:a=>{need(a,3,4);const k=V(a[0]),L=flat(rngOf(a[1])),Rt=rngOf(a[2]).rng;const i=lookupIdx(L,k,0);if(i<0){if(a[3])return a[3]();throw ERR('#N/A','見つからない')}
    if(Rt.length===L.length&&Rt.length>1)return Rt[i].length===1?Rt[i][0]:{rng:[Rt[i]]};const f=flat({rng:Rt});return f[i]===undefined?null:f[i]},
  INDEX:a=>{need(a,2,3);const R=rngOf(a[0]).rng;let r=toNum(V(a[1])),c=a[2]?toNum(V(a[2])):1;if(R.length===1&&!a[2]){c=r;r=1}
    if(r<1||c<1||r>R.length||c>R[0].length)throw ERR('#REF!','範囲の外');return R[r-1][c-1]},
  MATCH:a=>{need(a,2,3);const k=V(a[0]),L=flat(rngOf(a[1]));const m=a[2]?toNum(V(a[2])):1;const i=lookupIdx(L,k,m===0?0:1);if(i<0)throw ERR('#N/A','見つからない');return i+1},
  SUMIF:a=>{need(a,2,3);const R=flat(rngOf(a[0])),t=makeCrit(V(a[1])),Sm=a[2]?flat(rngOf(a[2])):R;let s=0;R.forEach((x,i)=>{if(t(x)&&typeof Sm[i]==='number')s+=Sm[i]});return s},
  COUNTIF:a=>{need(a,2);const R=flat(rngOf(a[0])),t=makeCrit(V(a[1]));return R.filter(t).length},
  AVERAGEIF:a=>{need(a,2,3);const R=flat(rngOf(a[0])),t=makeCrit(V(a[1])),Sm=a[2]?flat(rngOf(a[2])):R;let s=0,n=0;R.forEach((x,i)=>{if(t(x)&&typeof Sm[i]==='number'){s+=Sm[i];n++}});if(!n)throw ERR('#DIV/0!');return s/n},
  /* --- 配列 --- */
  SEQUENCE:a=>{need(a,1,4);const r=Math.floor(toNum(V(a[0]))),c=a[1]?Math.floor(toNum(V(a[1]))):1,st=a[2]?toNum(V(a[2])):1,sp=a[3]?toNum(V(a[3])):1;
    if(r<1||c<1)throw ERR('#VALUE!','行数・列数は1以上');if(r*c>100000)throw ERR('#NUM!','10万個まで');
    const o=[];for(let i=0;i<r;i++){const row=[];for(let j=0;j<c;j++)row.push(st+sp*(i*c+j));o.push(row)}return{rng:o}},
  ROWS:a=>{need(a,1);return toArr(a[0]()).length},
  COLUMNS:a=>{need(a,1);return toArr(a[0]())[0].length},
  TRANSPOSE:a=>{need(a,1);const M=toArr(a[0]());return{rng:M[0].map((_,j)=>M.map(r=>r[j]))}},
  FILTER:a=>{need(a,2,3);const M=toArr(a[0]()),I=toArr(a[1]());let out;
    if(I[0].length===1&&I.length===M.length)out=M.filter((_,i)=>toBool(I[i][0]));
    else if(I.length===1&&I[0].length===M[0].length){const keep=I[0].map(toBool);out=M.map(r=>r.filter((_,j)=>keep[j]));if(!out[0].length)out=[]}
    else throw ERR('#VALUE!','条件の大きさが範囲と合わない');
    if(!out.length){if(a[2])return a[2]();throw ERR('#CALC!','条件に合うものが無い')}return{rng:out}},
  SORT:a=>{need(a,1,3);const M=toArr(a[0]()).map(r=>r.slice());const k=a[1]?toNum(V(a[1]))-1:0,o=a[2]?toNum(V(a[2])):1;
    if(k<0||k>=M[0].length)throw ERR('#VALUE!');M.sort((x,y)=>{const d=cmpVals(x[k],y[k]);return o<0?-d:d});return{rng:M}},
  UNIQUE:a=>{need(a,1);const M=toArr(a[0]());const seen=new Set(),out=[];for(const r of M){const k=JSON.stringify(r.map(x=>typeof x==='string'?x.toLowerCase():x));if(!seen.has(k)){seen.add(k);out.push(r)}}return{rng:out}},
  VSTACK:a=>{const Ms=a.map(t=>toArr(t()));const w=Math.max(...Ms.map(m=>m[0].length));const out=[];for(const M of Ms)for(const r of M){const o=r.slice();while(o.length<w)o.push(ERR('#N/A'));out.push(o)}return{rng:out}},
  HSTACK:a=>{const Ms=a.map(t=>toArr(t()));const h=Math.max(...Ms.map(m=>m.length));const out=[];for(let i=0;i<h;i++){const o=[];for(const M of Ms){const w=M[0].length;for(let j=0;j<w;j++)o.push(M[i]?M[i][j]:ERR('#N/A'))}out.push(o)}return{rng:out}},
  /* --- LAMBDA を使う繰り返し（Excel 365 と同じ名前） --- */
  MAP:a=>{if(a.length<2)throw ERR('#VALUE!','MAP(範囲, …, LAMBDA)');const f=fnOf(a[a.length-1]);const Ms=a.slice(0,-1).map(t=>toArr(t()));const M0=Ms[0];
    return{rng:M0.map((row,i)=>row.map((_,j)=>tryErr(()=>scalar(callClosure(f,Ms.map(M=>M[i]&&M[i][j]!==undefined?M[i][j]:null))))))}},
  REDUCE:a=>{need(a,3);let acc=a[0]();const M=toArr(a[1]()),f=fnOf(a[2]);for(const r of M)for(const x of r)acc=callClosure(f,[acc,x]);return acc},
  SCAN:a=>{need(a,3);let acc=a[0]();const M=toArr(a[1]()),f=fnOf(a[2]);return{rng:M.map(r=>r.map(x=>{acc=callClosure(f,[acc,x]);return scalar(acc)}))}},
  BYROW:a=>{need(a,2);const M=toArr(a[0]()),f=fnOf(a[1]);return{rng:M.map(r=>[tryErr(()=>scalar(callClosure(f,[{rng:[r]}])))])}},
  BYCOL:a=>{need(a,2);const M=toArr(a[0]()),f=fnOf(a[1]);return{rng:[M[0].map((_,j)=>tryErr(()=>scalar(callClosure(f,[{rng:M.map(r=>[r[j]])}]))))]}},
  MAKEARRAY:a=>{need(a,3);const R=Math.floor(toNum(V(a[0]))),C=Math.floor(toNum(V(a[1]))),f=fnOf(a[2]);if(R<1||C<1)throw ERR('#VALUE!');if(R*C>100000)throw ERR('#NUM!');
    const o=[];for(let i=1;i<=R;i++){const row=[];for(let j=1;j<=C;j++)row.push(tryErr(()=>scalar(callClosure(f,[i,j]))));o.push(row)}return{rng:o}},
  /* --- 方眼シート独自のループ（VBA の Do While / For に当たるもの） --- */
  LOOP:a=>{need(a,3,4);let s=a[0]();const cond=fnOf(a[1]),step=fnOf(a[2]),max=loopLimit(a[3],10000);
    for(let i=1;;i++){if(!toBool(scalar(callClosure(cond,[s,i]))))return s;if(i>max)throw ERR('#LOOP!',`上限 ${max} 回に達しても条件が終わらない`);s=callClosure(step,[s,i])}},
  LOOPLIST:a=>{need(a,3,4);let s=a[0]();const cond=fnOf(a[1]),step=fnOf(a[2]),max=loopLimit(a[3],10000);const out=[scalar(s)];
    for(let i=1;;i++){if(!toBool(scalar(callClosure(cond,[s,i]))))return colOf(out);if(i>max)throw ERR('#LOOP!',`上限 ${max} 回に達しても条件が終わらない`);s=callClosure(step,[s,i]);out.push(scalar(s))}},
  ITERATE:a=>{need(a,3);let s=a[0]();const n=Math.floor(toNum(V(a[1]))),f=fnOf(a[2]);if(n<0||n>LOOP_CAP)throw ERR('#VALUE!','回数は0〜100万');for(let i=1;i<=n;i++)s=callClosure(f,[s,i]);return s},
  FOR:a=>{need(a,3,4);const st=toNum(V(a[0])),en=toNum(V(a[1]));let f,sp=1;if(a.length===4){sp=toNum(V(a[2]));f=fnOf(a[3])}else f=fnOf(a[2]);
    if(sp===0)throw ERR('#VALUE!','刻みが0');const out=[];for(let i=st;sp>0?i<=en+1e-9:i>=en-1e-9;i+=sp){if(out.length>=100000)throw ERR('#LOOP!','10万回まで');out.push(tryErr(()=>scalar(callClosure(f,[i]))))}return colOf(out)},
  /* --- LLM（答えはキャッシュして、同じ問いでは呼び直さない） --- */
  LLM:(a)=>LLMCore.call(a),
};
const FN_GROUPS=[
  ['ループ・LAMBDA','LET LAMBDA MAP REDUCE SCAN BYROW BYCOL MAKEARRAY LOOP LOOPLIST ITERATE FOR'],
  ['LLM','LLM'],
  ['配列','SEQUENCE FILTER SORT UNIQUE TRANSPOSE VSTACK HSTACK ROWS COLUMNS TEXTSPLIT'],
  ['集計','SUM AVERAGE MIN MAX COUNT COUNTA COUNTBLANK MEDIAN PRODUCT SUMIF COUNTIF AVERAGEIF'],
  ['論理','IF IFS SWITCH CHOOSE IFERROR AND OR NOT ISBLANK ISNUMBER ISTEXT ISERROR ISODD ISEVEN'],
  ['検索','VLOOKUP HLOOKUP XLOOKUP INDEX MATCH'],
  ['数学','ROUND ROUNDUP ROUNDDOWN INT ABS MOD SQRT POWER PI RAND VALUE'],
  ['文字列','CONCAT CONCATENATE TEXTJOIN LEN LEFT RIGHT MID UPPER LOWER TRIM SUBSTITUTE'],
  ['日付','TODAY NOW']];

/* ---------- LLM（数式の側） ----------
   ・同じ問い（provider の設定・送る文・形）なら、前の答えを使う。勝手に呼び直さない。
   ・呼ぶのは1本ずつ。順番待ちの間は #待機中、書いている間は #実行中。
   ・手動のとき（既定）は #未実行 のまま待ち、「LLMを実行」で動く。
   ・失敗は #LLM! として残し、自動では再試行しない（再実行はユーザーが選ぶ）。 */
function hashStr(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const wrapAnswer=s=>({type:'object',properties:{answer:s},required:['answer']});
const LLMCore={
  results:new Map(),errors:new Map(),queued:new Set(),running:null,pending:new Map(),
  enqueue:null,                       // UI の側が差し込む（エンジンだけのテストでは null）
  beginPass(){this.pending=new Map()},
  plainOf(v){if(v===null)return'';if(isErr(v))return v.err;return toStr(v)},
  build(instr,input,form,pname){
    const L=wb.llm||DEFAULT_LLM();const def=(L.providers||{})[pname];
    if(!def)throw ERR('#LLM!',`provider「${pname}」が設定に無い（LLM の設定で足す）`);
    if(!def.adapter)throw ERR('#LLM!',`provider「${pname}」に adapter が無い`);
    let mode='text',schema=null;const f=form.toLowerCase();
    if(!form){}
    else if(f==='数値'||f==='number'){mode='number';schema=wrapAnswer({type:'number'})}
    else if(f==='整数'||f==='integer'){mode='integer';schema=wrapAnswer({type:'integer'})}
    else if(f==='真偽'||f==='boolean'){mode='boolean';schema=wrapAnswer({type:'boolean'})}
    else if(f==='リスト'||f==='list'){mode='list';schema=wrapAnswer({type:'array',items:{type:'string'}})}
    else if(form[0]==='{'){try{schema=JSON.parse(form)}catch(e){throw ERR('#LLM!','形の JSON schema が読めない')}mode='object'}
    else if(form.includes('|')){const o=form.split('|').map(s=>s.trim()).filter(Boolean);if(o.length<2)throw ERR('#LLM!','選択肢は2つ以上');mode='enum';schema=wrapAnswer({type:'string',enum:o})}
    else throw ERR('#LLM!',`形「${form}」が分からない（数値・整数・真偽・リスト・A|B|C・JSON schema）`);
    let user=instr;if(input)user+='\n\n入力:\n'+input;
    if(schema)user+=mode==='object'?'\n\nJSONだけを出す。':'\n\nJSONだけを出す。形は {"answer": …}。';
    const messages=[{role:'system',content:L.system||DEFAULT_SYSTEM},{role:'user',content:user}];
    const generation=Object.assign({},def.generation||{});
    const key=hashStr(JSON.stringify({def,messages,schema,generation}));
    return{key,def,messages,schema,generation,mode,pname,label:instr.replace(/\s+/g,' ').slice(0,40)};
  },
  toValue(v,mode){
    if(mode==='text')return typeof v==='string'?v.trim():v;
    if(mode==='object'){
      if(Array.isArray(v))return colOf(v.map(x=>x!==null&&typeof x==='object'?JSON.stringify(x):x));
      if(v&&typeof v==='object'){const ks=Object.keys(v);if(!ks.length)throw ERR('#CALC!','答えが空');
        const row=ks.map(k=>v[k]!==null&&typeof v[k]==='object'?JSON.stringify(v[k]):v[k]);return row.length===1?row[0]:{rng:[row]}}
      return v;
    }
    const x=v&&typeof v==='object'&&!Array.isArray(v)?v.answer:v;
    if(mode==='list'){if(!Array.isArray(x))throw ERR('#LLM!','リストで返ってこなかった');return colOf(x.map(s=>typeof s==='object'?JSON.stringify(s):s))}
    return x;
  },
  call(a){
    need(a,1,4);
    const instr=toStr(V(a[0]));
    const iv=a[1]?a[1]():null;
    const input=iv===null?'':isArr(iv)?iv.rng.map(r=>r.map(x=>this.plainOf(x)).join('\t')).join('\n'):toStr(iv);
    const form=a[2]?toStr(V(a[2])).trim():'';
    const pname=a[3]?toStr(V(a[3])).trim():((wb.llm&&wb.llm.def)||'local');
    const req=this.build(instr,input,form,pname);
    if(evalCell){let s=cellLLM.get(evalCell);if(!s){s=new Set();cellLLM.set(evalCell,s)}s.add(req.key)}
    const hit=this.results.get(req.key);
    if(hit)return this.toValue(hit.v,req.mode);
    const er=this.errors.get(req.key);
    if(er)throw ERR(er.code==='CANCELLED'?'#LLM!':'#LLM!',`${er.code}: ${er.message}`);
    if(this.running&&this.running.key===req.key)throw ERR('#実行中','LLM が答えを書いている');
    if(this.queued.has(req.key))throw ERR('#待機中','順番待ち（LLM は1本ずつ呼ぶ）');
    if(wb.llm&&wb.llm.auto&&this.enqueue){this.enqueue(req);throw ERR('#待機中','順番待ち（LLM は1本ずつ呼ぶ）')}
    this.pending.set(req.key,req);
    throw ERR('#未実行','「LLMを実行」で動かす（手動モード）');
  },
};

/* ---------- ハーネスのノードを数式で動かす ----------
   harness.html のハーネスを「1行＝1ノード」の数式にしたものが、ここの関数で動く（ハーネスの「方眼で動かす」）。

/* LLMNODE の1回ぶん。切れたとき（onTruncate）・形に合わなかったとき（onBadOutput）の扱いは harness の invokeNode と同じ:
     retry … 切れたら maxTokens を倍にしてやり直す／形に合わなければもう一度聞く（どちらも2回まで）
     use   … 切れたところまでを使う（JSON は閉じ直して、形を確かめる）
   やり直しのたびに文脈の窓に入るかを測り直す（入らなければ送らない） */
async function llmInvokeNode(job,def,adapter,handle,signal){
  const node=job.node,schema=job.schema,pol=node.onTruncate||'error',badPol=node.onBadOutput||'error';
  let gen=job.generation,tries=0,badTries=0,res=null;
  for(;;){
    try{
      const over=hCtxOver(def,node,job.messages,gen);if(over)throw over;
      res=await adapter.invoke({providerDef:def,handle,model:def.model,input:{messages:job.messages},generation:gen,schema,signal,onToken:()=>{}});
    }catch(err){
      if(err&&err.providerState==='needs_reset'&&!err._reset){err._reset=true;try{await ModelManager.resetFor(def,adapter)}catch(_){}}
      if(err&&err.truncated&&pol==='retry'&&tries<2){tries++;gen=Object.assign({},gen,{maxTokens:(gen.maxTokens||256)*2});continue}
      if(err&&err.code==='SCHEMA_VALIDATION_ERROR'&&!err.truncated&&badPol==='retry'&&badTries<2){badTries++;continue}
      if(err&&err.truncated&&pol==='use'){
        const t=String(err.partialText==null?'':err.partialText);
        if(!schema)return{output:{type:'text',value:t},usage:err.usage,raw:t};
        let v=null;try{v=JSON.parse(HX.closeJSON(HX.stripFence(t)))}catch(_){v=null}
        if(v!==null){try{checkSchema(v,schema)}catch(e){throw Object.assign({},e,{usage:err.usage})}
          return{output:{type:'json',value:v},usage:err.usage,raw:t}}
        throw Object.assign({},err,{message:err.message+'（閉じ直しても JSON にならなかった）'});
      }
      throw err;
    }
    break;
  }
  if(res&&res.cancelled)return res;
  if(!res||!res.output)throw{code:'PROVIDER_ERROR',retryable:false,message:'Providerがoutputを返さない'};
  return res;
}
/* ---------- 計算ノード（JavaScript）を動かす（画面の側） ----------
   harness の runJS と同じ: 別スレッド（Worker）で動かし、3秒で打ち切る。答えは JSCore に覚える。
   Worker が作れない端末では同じ画面の中で動かす（その場合は打ち切れない）。 */
const JSQ={queue:[],busy:false,limit:3000};
let jsW=null,jsWBroken=false,jsWSeq=0;
function jsWorkerGet(){
  if(jsW||jsWBroken)return jsW;
  try{jsW=new Worker(URL.createObjectURL(new Blob([HX.jsWorkerSrc()],{type:'text/javascript'})))}catch(e){jsWBroken=true;jsW=null}
  return jsW;
}
function jsRunHere(job){
  let v;try{v=new Function(...job.names,'"use strict";'+job.code)(...job.vals)}
  catch(e){throw{code:'CODE_RUNTIME_ERROR',retryable:false,message:`${job.where}: 途中で止まった — ${errText(e)}`}}
  if(v===undefined)throw{code:'CODE_NO_RETURN',retryable:false,message:`${job.where}: return で値を返していない`};
  return v;
}
function jsRunOne(job){
  const w=jsWorkerGet();
  if(!w)return new Promise(r=>r(jsRunHere(job)));
  const id=++jsWSeq,limit=JSQ.limit;let clean;
  return new Promise((res,rej)=>{
    const t=setTimeout(()=>{clean();try{jsW.terminate()}catch(_){}jsW=null;
      rej({code:'CODE_TIMEOUT',retryable:false,message:`${job.where}: ${limit/1000}秒で終わらなかったので打ち切った（終わらない繰り返しを書いていないか）`})},limit);
    const on=ev=>{const d=ev.data||{};if(d.id!==id)return;clean();
      if(!d.ok)rej({code:'CODE_RUNTIME_ERROR',retryable:false,message:`${job.where}: 途中で止まった — ${d.err}`});
      else if(d.undef)rej({code:'CODE_NO_RETURN',retryable:false,message:`${job.where}: return で値を返していない`});
      else res(d.v)};
    clean=()=>{clearTimeout(t);if(jsW)jsW.removeEventListener('message',on)};
    w.addEventListener('message',on);
    try{w.postMessage({id,code:job.code,names:job.names,vals:job.vals})}
    catch(e){clean();rej({code:'CODE_RUNTIME_ERROR',retryable:false,message:`${job.where}: 値を渡せない — ${errText(e)}`})}
  });
}
JSCore.enqueue=job=>{
  if(JSCore.queued.has(job.key)||JSCore.running.has(job.key))return;
  JSQ.queue.push(job);JSCore.queued.add(job.key);setTimeout(jsPump,0);
};
async function jsPump(){
  if(JSQ.busy||!JSQ.queue.length)return;
  JSQ.busy=true;const job=JSQ.queue.shift();JSCore.queued.delete(job.key);JSCore.running.add(job.key);
  try{const v=await jsRunOne(job);JSCore.results.set(job.key,v)}
  catch(e){JSCore.errors.set(job.key,e&&e.code?{code:e.code,message:errText(e)}:{code:'CODE_RUNTIME_ERROR',message:`${job.where}: ${errText(e)}`})}
  finally{
    JSCore.running.delete(job.key);JSQ.busy=false;
    if(JSCore.results.size>3000)JSCore.results.clear();
    paint();setTimeout(jsPump,0);
    llmFollow();setTimeout(llmPump,0);           // 計算が済んで、次の LLM が呼べるようになったかもしれない
  }
}
function llmStop(){
  const n=LLMQ.queue.length+(LLMCore.running?1:0);
  LLMQ.follow=null;for(const r of LLMQ.queue)LLMCore.queued.delete(r.key);LLMQ.queue=[];LLMQ.total=0;LLMQ.done=0;
  if(LLMQ.ctrl)try{LLMQ.ctrl.abort()}catch(_){}
  paint();return n;
}
function llmKeysIn(R){const keys=new Set();const si=wb.active;
  for(let r=R.r1;r<=R.r2;r++)for(let c=R.c1;c<=R.c2;c++){const s=cellLLMOf(si,r,c);if(s)s.forEach(k=>keys.add(k))}return keys}
function cellLLMOf(si,r,c){const own=spillAtUI(si,r,c);const k=own?si+','+own.r+','+own.c:si+','+r+','+c;return CELL_LLM().get(k)}
function llmRerun(R){
  const keys=llmKeysIn(R);let n=0;
  keys.forEach(k=>{if(LLMCore.results.delete(k))n++;if(LLMCore.errors.delete(k))n++});
  llmSaveCache();paint();return keys.size;
}
function updateLLMChip(){
  const chip=$('llmChip'),t=$('llmChipT');if(!chip)return;
  chip.classList.remove('run','wait');
  const pend=LLMCore.pending.size,q=LLMQ.queue.length;
  if(LLMCore.running){chip.classList.add('run');
    t.textContent=`LLM 実行中${q?` · 残り${q}`:''}${LLMQ.progress?` · ${LLMQ.progress}`:` · ${LLMCore.running.label}`}`}
  else if(pend){chip.classList.add('wait');t.textContent=`▶ LLMを実行（${pend}件）`}
  else t.textContent=wb&&wb.llm&&wb.llm.auto?'LLM 自動':'LLM';
  if(!$('modal').hidden&&$('panel').dataset.kind==='llm')renderLLMStatus();
  updateDemoBar();
}

      +`押すと ${what} がセルを1つずつ埋め、集計の列もそれに合わせて変わります。初回だけモデル（約300MB）を取得し、2回目からは端末に残ります。`
      +(gpu?'':'この端末・ブラウザは WebGPU が使えないため端末内 LLM は動きません。「LLM」の設定で provider「device」を Ollama などに変えると実行できます。')+`</span>`}
  else{btn.hidden=true;tx.innerHTML=`<b>完了</b> · LLM の答え ${done}件<span class="sub">問い合わせを書き換えると、変わったセルだけ #未実行 になり、また実行できます。答えは端末に保存されます。</span>`}
}
/* ハーネスから来たシート: このシートの LLM だけを動かす（ほかのシートの #未実行 には触らない） */
function updateHarnessBar(bar,sh){
  const keys=sheetLLMKeys(wb.active);let done=0,pend=0,err=0;
  for(const k of keys){if(LLMCore.results.has(k))done++;else if(LLMCore.errors.has(k))err++;else pend++}
  const busy=LLMCore.running||LLMQ.queue.length||LLMQ.follow||JSQ.busy||JSQ.queue.length;
  const tx=$('demoTx'),btn=$('demoRun');bar.hidden=false;
  const nm=esc((sh.harness&&sh.harness.name)||sh.name);
  if(busy){btn.hidden=true;tx.innerHTML=`<b>実行中</b> · ${LLMQ.progress?esc(LLMQ.progress):`LLM の答え ${done}件`}<span class="sub">ハーネス「${nm}」を手前のノードから順に計算している。下の「LLM 実行中」で止められる。</span>`}
  else if(pend){btn.hidden=false;btn.textContent='▶ ハーネスを実行';
    tx.innerHTML=`<b>ハーネス「${nm}」</b> · 1つのセルが1つのノード（セルを選ぶと名前が出る）<span class="sub">押すと、このシートの LLM だけを順に呼ぶ。計算ノードは自動で動く。入力のセル（黄色）を書き換えると、変わったところから先がまた #未実行 になる。${err?` 失敗した LLM ${err}件はセルを選んで「再実行」。`:''}</span>`}
  else{btn.hidden=true;tx.innerHTML=`<b>完了</b> · ハーネス「${nm}」 · LLM の答え ${done}件${err?` · 失敗 ${err}件`:''}<span class="sub">答えは端末に保存される。入力のセルを書き換えると、また実行できる。</span>`}
}
function demoRun(){
  const si=wb.active;const keys=sheetLLMKeys(si);keys.forEach(k=>LLMCore.errors.delete(k));paint();
  const n=llmRunPending(k=>sheetLLMKeys(si).has(k));updateDemoBar();return n;
}

function parseDelimited(text,d){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch;continue}
    if(ch==='"'&&f===''){q=true;continue}
    if(ch===d){row.push(f);f='';continue}
    if(ch==='\n'){row.push(f);rows.push(row);row=[];f='';continue}
    if(ch==='\r')continue;f+=ch;}
  row.push(f);rows.push(row);return rows;
}

function renderLLMStatus(){
  const box=$('llmStat');if(!box)return;
  const q=LLMQ.queue.length,pend=LLMCore.pending.size;
  const lines=[];
  if(LLMCore.running)lines.push(`実行中: 「${esc(LLMCore.running.label)}」 · ${esc(LLMCore.running.pname)}${LLMQ.progress?' · '+esc(LLMQ.progress):''}`);
  lines.push(`順番待ち ${q}件 · 未実行 ${pend}件 · 答えのキャッシュ ${LLMCore.results.size}件 · 失敗・停止 ${LLMCore.errors.size}件`);
  box.innerHTML=lines.map(l=>`<div>${l}</div>`).join('');
  const b=$('llmRun');if(b){b.disabled=!pend;b.textContent=`▶ 未実行を実行（${pend}）`}
  const s=$('llmStop');if(s)s.disabled=!(q||LLMCore.running);
}

let toastT=null;
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;t.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.opacity='0';setTimeout(()=>{t.hidden=true},220)},2600)}

/* ---------- 改行のあるセルは、改行を残せる欄で直す ----------
   セルの入力欄と数式バーは1行の欄なので、改行（プロンプトやコードの中の改行）が消えてしまう。
   中に改行があるセルは、ここ（複数行の欄）で直す。 */
function openLongEdit(r,c){

const hasNL=t=>typeof t==='string'&&t.includes('\n');

/* ---------- Harness Studio の「方眼」タブの中で開いたとき（sheet.html?embed=harness） ----------
   ・本（ブック）はこの端末に保存しない。シートは親（harness.html）から来たもの1枚だけ。
   ・書き換えたら、セルの中身を親へ送る。親がハーネスに戻せたら、作り直したシートが返ってくる。
     戻せなければ理由が返ってくるので、書き換える前に戻す（黙って捨てない）。
   ・LLM は親の Provider で動かす（engine を2つ作らない＝メモリを2倍にしない）。 */
const EMB={on:new URLSearchParams(location.search).get('embed')==='harness',last:null,waiting:false,t:null,seq:0};
/* 送るのはセルの中身と、どのノードのセルか（nid。式には書かないノードの名前） */
function embedCellsV(sh){const o={};for(const k in sh.cells){const x=sh.cells[k];const v=x&&x.v;if(v!=null&&v!=='')o[k]=x.nid?{v:String(v),nid:x.nid}:{v:String(v)}}return o}
const embedSame=(a,b)=>(a?a.v:'')===(b?b.v:'')&&(a&&a.nid||'')===(b&&b.nid||'');
function embedLoad(m){
  if(editing)endEdit();
  const sh=S();const before=sh.nr+'x'+sh.nc;
  sh.cells=JSON.parse(JSON.stringify(m.sheet.cells||{}));
  sh.nr=Math.max(m.sheet.nr||100,40);sh.nc=Math.max(m.sheet.nc||26,8);sh.cw=Object.assign({},m.sheet.cw||{});
  sh.harness=m.sheet.harness||{name:null};sh.name=m.sheet.name||'ハーネス';
  wb.llm.providers=JSON.parse(JSON.stringify(m.providers||{}));wb.llm.def='';
  EMB.last=embedCellsV(sh);EMB.waiting=false;
  if(before!==sh.nr+'x'+sh.nc)build();
  if(m.focus&&m.focus.row!=null){anchor={r:m.focus.row,c:m.focus.col!=null?m.focus.col:anchor.c};focusC=Object.assign({},anchor);prevSel=null}
  paint();updateSel();
}
function embedSend(){
  if(!EMB.on||!EMB.last)return;
  const now=embedCellsV(S());const changes={};
  for(const k of new Set([...Object.keys(now),...Object.keys(EMB.last)]))if(!embedSame(now[k],EMB.last[k]))changes[k]=now[k]==null?null:now[k];
  if(!Object.keys(changes).length)return;
  EMB.waiting=true;
  parent.postMessage({type:'hs-edit',seq:++EMB.seq,cells:now,changes,at:{r:anchor.r,c:anchor.c}},'*');
}
function embedReject(m){
  const sh=S();const keep={};for(const k in sh.cells){const x=sh.cells[k];const y=Object.assign({},x);delete y.v;delete y.nid;keep[k]=y}
  sh.cells={};for(const[k,c]of Object.entries(EMB.last||{}))sh.cells[k]=Object.assign({},keep[k]||{},c);
  EMB.waiting=false;paint();updateSel();
  toast('入れなかった: '+String(m.reason||'').slice(0,160));
}
/* LLM の橋渡し: 送る文・generation・schema を親へ渡し、親の Provider（と ModelManager）で動かした答えを受け取る */
const BRIDGE={seq:0,wait:new Map()};
const BridgeProvider={id:'bridge',label:'Harness Studio（親）',
  invoke(req){return new Promise((res,rej)=>{
    const id=++BRIDGE.seq;const job=LLMCore.running;
    BRIDGE.wait.set(id,{res,rej});
    parent.postMessage({type:'hs-llm',id,def:req.providerDef,model:req.model,messages:req.input.messages,generation:req.generation,
      schema:req.schema,bridge:(job&&job.bridge)||null},'*');
    if(req.signal)req.signal.addEventListener('abort',()=>parent.postMessage({type:'hs-llm-abort',id},'*'),{once:true});
  })}};
function bridgeReply(m){
  const w=BRIDGE.wait.get(m.id);if(!w)return;
  if(m.progress){LLMQ.progress=String(m.progress).slice(0,60);updateLLMChip();return}
  BRIDGE.wait.delete(m.id);LLMQ.progress='';
  if(m.ok)w.res(m.out);else w.rej(Object.assign({_reset:true},m.err||{code:'PROVIDER_ERROR',message:'親から理由が来なかった'}));
}
if(EMB.on){
  window.addEventListener('message',ev=>{
    if(ev.source!==parent)return;const m=ev.data||{};
    if(m.type==='hs-load')embedLoad(m);
    else if(m.type==='hs-reject')embedReject(m);
    else if(m.type==='hs-llm-result')bridgeReply(m);
    else if(m.type==='hs-run')demoRun();
    else if(m.type==='hs-stop')llmStop();
  });
}

/* ---------- ハーネスから来たシート（harness.html の「方眼で動かす」） ----------
   harness.html が localStorage に置いた1件を読み、新しいシートとして足す（今あるシートには触らない）。読んだら消す。
   provider は同じ名前で中身が違うものがあれば名前を変えて足し、そのシートの LLMNODE / HLLM / NODE.LLM の名前も合わせる。 */
const LS_IMPORT='hogan-sheet.import.v1';
function importHarness(){
  let o=null;try{o=JSON.parse(localStorage.getItem(LS_IMPORT)||'null')}catch(_){o=null}
  if(!o||!o.sheet||!o.sheet.cells)return null;
  try{localStorage.removeItem(LS_IMPORT)}catch(_){}
  const P=wb.llm.providers=wb.llm.providers||{};const rename={};
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  for(const[name,def]of Object.entries(o.providers||{})){
    let n=name,i=2;while(P[n]&&!same(P[n],def))n=name+'_'+(i++);
    P[n]=def;if(n!==name)rename[name]=n;
  }
  const sh=Object.assign(newSheet(''),o.sheet);sh.name=uniqueName(o.sheet.name||'ハーネス');
  if(Object.keys(rename).length)for(const k in sh.cells){const c=sh.cells[k];
    if(typeof c.v==='string'&&c.v[0]==='=')c.v=c.v.replace(/(LLMNODE|HLLM|NODE\.LLM)\("((?:[^"]|"")*)"/gi,(m,f,n)=>{const u=n.replace(/""/g,'"');return rename[u]?f+'("'+rename[u].replace(/"/g,'""')+'"':m})}
  wb.sheets.push(sh);wb.active=wb.sheets.length-1;save();
  return{name:sh.name,rename};
}

/* ---------- boot ---------- */
wb=EMB.on?fixBook({sheets:[newSheet('ハーネス')],active:0,names:{}}):load();
if(EMB.on)document.body.classList.add('embed');
llmLoadCache();
let IMPORTED=null;
if(location.hash==='#import'&&!EMB.on){
  IMPORTED=importHarness();
  try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}
}
renderTabs();build();
window.addEventListener('hashchange',()=>{if(location.hash!=='#import')return;
  if(editing)commitEdit(0,0);const r=importHarness();try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}
  if(r){IMPORTED=r;renderTabs();build();toast(`ハーネスを「${r.name}」に入れた。上の「▶ ハーネスを実行」で動く`)}});
if(IMPORTED)setTimeout(()=>toast(`ハーネスを「${IMPORTED.name}」に入れた。上の「▶ ハーネスを実行」で動く`
  +(Object.keys(IMPORTED.rename).length?`（provider 名を ${Object.entries(IMPORTED.rename).map(([a,b])=>a+'→'+b).join('、')} にした）`:'')),300);
if(!coarse)ed.focus({preventScroll:true});
window.addEventListener('resize',()=>updateSel());
if(location.protocol.startsWith('http')&&!EMB.on)loadSiteModels();
if(EMB.on)parent.postMessage({type:'hs-ready'},'*');
/* テストから中を見る口（tests/sheet.mjs） */
window.__sheet={engine:ENGINE,LLMCore,LLMQ,PROVIDERS,TRANSPORTS,ModelManager,paint,get wb(){return wb},set wb(v){wb=fixBook(v);renderTabs();build()},runPending:llmRunPending,demoRun,stop:llmStop,rerun:llmRerun,select,extend,JSCore,JSQ,importHarness,get imported(){return IMPORTED},EMB,openLongEdit,commitValue,save,pushUndo};
})();
